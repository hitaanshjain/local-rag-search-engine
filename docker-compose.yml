services:
  # The UI Layer (Nginx serving React)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # The API Layer (FastAPI)
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  # The Inference Engine (Ollama + Llama 3.2)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]